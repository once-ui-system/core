# Quality gates for @once-ui-system/core (with @once-ui-system/fx and
# @once-ui-system/blocks): every pull request and every push to
# main must build, typecheck, pass its tests, add no lint errors and keep the
# docs app building, in step with the code and free of browser errors.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request supersedes the run in progress; runs on main
# always finish, so every commit there has a result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (no new errors)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # pnpm's version comes from `packageManager` in the root package.json (10.14.0).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Biome needs no build, so skip the prepare step that builds packages/core.
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The package still carries lint errors from before this gate, so a plain
      # `biome check` cannot pass yet. The gate fails only if the error count
      # rises above packages/core/lint-baseline.json.
      - name: Lint gate
        run: pnpm --filter @once-ui-system/core lint:gate

      # fx and blocks left core with their old errors; each holds its own line.
      - name: Lint gate (fx, blocks)
        run: pnpm --filter @once-ui-system/fx --filter @once-ui-system/blocks lint:gate

  test:
    name: Build, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # pnpm's version comes from `packageManager` in the root package.json (10.14.0).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # @once-ui-system/fx and @once-ui-system/blocks (3.0, F8 and F10) build
      # against core's dist and test against it, so core goes first.
      - name: Build
        run: |
          pnpm --filter @once-ui-system/core build
          pnpm --filter @once-ui-system/fx --filter @once-ui-system/blocks build

      - name: Typecheck
        run: pnpm --filter @once-ui-system/core --filter @once-ui-system/fx --filter @once-ui-system/blocks typecheck

      - name: Test
        run: pnpm --filter @once-ui-system/core --filter @once-ui-system/fx --filter @once-ui-system/blocks test

      # Advisory: publint and arethetypeswrong (esm-only profile). Both pass
      # since the 3.0 real-ESM build (see AGENTS.md); the step still never
      # fails the run. Read its log for new failures.
      - name: Package checks (advisory, does not fail CI)
        continue-on-error: true
        run: pnpm --filter @once-ui-system/core --filter @once-ui-system/fx --filter @once-ui-system/blocks check:package

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # pnpm's version comes from `packageManager` in the root package.json (10.14.0).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The docs prerender every component page against the built package, so
      # a component that throws while rendering on the server fails here, as it
      # would on the docs deployment (apps/docs/vercel.json runs the same build).
      - name: Build core, fx and blocks
        run: |
          pnpm --filter @once-ui-system/core build
          pnpm --filter @once-ui-system/fx --filter @once-ui-system/blocks build

      # Every example on the site and in the agent harness is typechecked
      # against the built package, and every props table against the spec,
      # so a renamed prop or a wrong default fails here instead of on a page.
      - name: Docs match the code
        run: pnpm --filter @once-ui-system/docs check:docs

      - name: Build docs
        run: pnpm --filter @once-ui-system/docs build

      # Typechecking can't see an example that throws when used, or a page
      # that logs errors in the browser. Every page of the built site is opened
      # in the runner's Chrome, scrolled, and its previews' controls pressed.
      - name: Docs pages run in a browser
        working-directory: apps/docs
        run: |
          pnpm start -p 3000 > /tmp/docs-server.log 2>&1 &
          for i in $(seq 60); do curl -sf -o /dev/null http://localhost:3000/sitemap.xml && break; sleep 1; done
          pnpm check:render

  native:
    name: Native preview and token export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # pnpm's version comes from `packageManager` in the root package.json (10.14.0).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Installing builds packages/foundations (and core) through `prepare`.
      - name: Install
        run: pnpm install --frozen-lockfile

      # tokens/once-ui.tokens.json must match scss/tokens/, since native and
      # core's tokens.json both ship it.
      - name: Token export up to date
        run: pnpm --filter @once-ui-system/foundations check:tokens

      - name: Foundations tests
        run: pnpm --filter @once-ui-system/foundations test

      # src/icons/data.ts is a copy of core's built-in icons.
      - name: Icon copy up to date
        run: pnpm --filter @once-ui-system/native check:icons

      - name: Lint
        run: pnpm --filter @once-ui-system/native lint

      - name: Typecheck
        run: pnpm --filter @once-ui-system/native typecheck

      - name: Test
        run: pnpm --filter @once-ui-system/native test

      # The same components against the real react-native package (Jest with
      # React Native's preset), not the react-native-web stand-in.
      - name: Test on React Native
        run: pnpm --filter @once-ui-system/native test:native

      # Metro bundles the demo for Android and iOS and Hermes compiles it,
      # as a release build of an app would.
      - name: Bundle for Android and iOS
        run: pnpm --filter @once-ui-system/native bundle:native

      - name: Build
        run: pnpm --filter @once-ui-system/native build
